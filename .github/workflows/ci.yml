name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff mypy pyyaml watchdog
      - name: Lint (ruff)
        run: ruff check . || true
      - name: Type check (mypy)
        run: mypy btl --ignore-missing-imports || true
      - name: Tests
        run: pytest -q
